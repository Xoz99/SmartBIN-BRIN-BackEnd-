# Produksi VPS — Postgres + Redis + Backend + Caddy (auto-HTTPS).
# Sengaja RAMPING: classify (YOLO) & mosquitto lokal TIDAK disertakan (opsional,
# backend tetap jalan tanpanya). MQTT pakai HiveMQ Cloud dari .env.
#
# Jalankan:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend npx prisma migrate deploy
#
# WAJIB set di shell/.env host: POSTGRES_PASSWORD (password DB yang kuat).

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartbin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: smartbin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind ke localhost VPS SAJA (127.0.0.1) — TIDAK publik. Buat akses GUI lewat
    # SSH tunnel: `ssh -L 5433:localhost:5432 root@<VPS>` lalu konek ke localhost:5433.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbin -d smartbin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartbin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbin-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override supaya nunjuk ke service internal compose (bukan localhost host).
      DATABASE_URL: postgresql://smartbin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/smartbin_db?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # MQTT: pakai nilai dari .env (HiveMQ Cloud) — TIDAK di-override ke mosquitto.
    depends_on:
      postgres:
        condition: service_healthy
    # DNS reliable — cegah 'getaddrinfo EAI_AGAIN' waktu resolve HiveMQ saat boot
    # (Docker embedded DNS kadang belum siap → MQTT gagal konek & tak retry).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./logs:/app/logs
    # Caddy proxy internal via jaringan compose (HTTPS publik).
    expose:
      - "3000"
    # Bind port 3000 ke IP Tailscale VPS SAJA (bukan publik) — supaya Raspi yang
    # di jaringan kost (yang tak bisa jangkau IP publik VPS) tetap bisa nembak
    # backend lewat Tailscale: BACKEND_HTTP_URL=http://<ip-tailscale-vps>:3000.
    # Default 127.0.0.1 = host-local saja (aman) kalau BACKEND_TS_BIND belum di-set.
    ports:
      - "${BACKEND_TS_BIND:-127.0.0.1}:3000:3000"

  # ─── Predict service (EfficientNet TFLite) — inference kamera admin ──────────
  predict:
    build:
      context: ./predict-service
      dockerfile: Dockerfile
    container_name: smartbin-predict
    restart: unless-stopped
    volumes:
      # Pakai model yang sama dengan Pi (ikut ke-clone di repo).
      - ./backend/model_advanced.tflite:/app/model/model_advanced.tflite:ro
    expose:
      - "9000"

  caddy:
    image: caddy:2-alpine
    container_name: smartbin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - predict

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
